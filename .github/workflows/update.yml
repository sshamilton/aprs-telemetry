name: Update APRS Data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Fix the Node deprecation & ensure environment is ready
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly grant write access
    steps:
      - uses: actions/checkout@v4 # Use v4 to stay current

      - name: Fetch and Process Data
        env:
          APRS_API_KEY: ${{ secrets.APRS_API_KEY }}
        run: |
          STATION="W2KGY" # Using your callsign
          echo "Fetching data for $STATION..."
          
          # 1. Fetch raw data
          curl -s "https://api.aprs.fi/api/get?name=$STATION&what=loc&apikey=$APRS_API_KEY&format=json" > raw.json
          
          # DEBUG: Log the raw response so you can see it in the Action logs
          echo "Raw API Response:"
          cat raw.json
          
          # 2. Extract values (Adjust indices [0],[1],[2] if your telemetry order is different)
          SOLAR=$(jq -r '.entries[0].telemetry[0] // 0' raw.json)
          BATT=$(jq -r '.entries[0].telemetry[1] // 0' raw.json)
          LIGHT_V=$(jq -r '.entries[0].telemetry[2] // 0' raw.json)
          
          echo "Parsed: Solar=$SOLAR, Batt=$BATT, Light=$LIGHT_V"
          
          # 3. Logic for status
          CURRENT_STATUS=$( [ $(echo "$LIGHT_V > 5" | bc -l) -eq 1 ] && echo "ON" || echo "OFF" )
          
          # 4. Handle State (Last Changed)
          if [ -f data.json ]; then
            OLD_STATUS=$(jq -r '.light_status' data.json)
            LAST_CHANGED=$(jq -r '.last_changed' data.json)
          else
            OLD_STATUS="UNKNOWN"
            LAST_CHANGED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          if [ "$CURRENT_STATUS" != "$OLD_STATUS" ]; then
            LAST_CHANGED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "Status changed from $OLD_STATUS to $CURRENT_STATUS"
          fi

          # 5. Write data.json
          jq -n \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg light_status "$CURRENT_STATUS" \
            --arg last_changed "$LAST_CHANGED" \
            --argjson solar_v "$SOLAR" \
            --argjson battery_v "$BATT" \
            '{last_updated: $last_updated, light_status: $light_status, last_changed: $last_changed, solar_v: $solar_v, battery_v: $battery_v}' > data.json
          
          echo "Generated data.json:"
          cat data.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data.json
          # Only push if there's a diff
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Telemetry Update: $(date -u)"
            git push
          fi
